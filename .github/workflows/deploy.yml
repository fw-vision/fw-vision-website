name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install dependencies
        env:
          # Secret cannot be named GITHUB_* (reserved). Map into the name .npmrc expects.
          GITHUB_TOKEN_FWVISION: ${{ secrets.FWVISION_NPM_TOKEN }}
        run: bun install --frozen-lockfile
      - name: Validate content
        run: bun run validate:content
      - name: Check Astro
        run: bun run check
      - name: Test
        run: bun run test
      - name: Build
        env:
          # Fall back when Actions vars are unset/empty so the subscribe form stays enabled.
          PUBLIC_LISTMONK_URL: ${{ vars.PUBLIC_LISTMONK_URL || 'https://fwvision-elitemini-series.tail0f7891.ts.net' }}
          PUBLIC_LISTMONK_LIST_UUID: ${{ vars.PUBLIC_LISTMONK_LIST_UUID || '2e695404-3067-4d75-9e09-e618b0b2b39c' }}
        run: bun run build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
